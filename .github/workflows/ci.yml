name: CI
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ask_url:
        description: "Ask endpoint URL to probe for smoke check"
        required: false
        default: "https://mechanic-rag.vercel.app/api/ask"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
        if: success() || failure()
      - run: pnpm test
        if: success() || failure()
      - run: pnpm build
        if: success() || failure()

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Install package + pytest
        run: pip install -e ".[dev]"
      - name: Public fail-closed
        run: python scripts/checks/public_fail_closed.py fixtures
      - name: Fast pytest subset
        if: success() || failure()
        run: pytest -m "not integration and not slow" --strict-markers

  prod_ask_smoke:
    name: Production Ask Smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Production Ask smoke probe
        run: python scripts/checks/prod_ask_smoke.py --url "${{ github.event.inputs.ask_url || 'https://mechanic-rag.vercel.app/api/ask' }}"

