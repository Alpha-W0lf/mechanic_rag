name: Demo keep-alive

on:
  schedule:
    # Mondays 14:00 UTC (9am CT) — far inside the Supabase free-tier 7-day pause window
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping demo readiness endpoint (touches Postgres)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            https://mechanic-rag.vercel.app/api/health || true)
          echo "health status: $code"
          # Any status is fine — the goal is a Postgres round-trip, not readiness=200.
